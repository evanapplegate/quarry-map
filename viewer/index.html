<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quarry Lightbox</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <div id="ui">
      <div class="row">
        <span class="lbl">Frame</span>
        <div class="seg">
          <button data-style="plain">Plain walnut</button>
          <button data-style="molding">Molding</button>
        </div>
      </div>
      <div class="row">
        <label class="lbl" for="color">Light color</label>
        <input type="color" id="color" />
      </div>
      <div id="status"></div>
      <div class="hint">Drag to orbit, scroll to zoom, right-drag to pan</div>
      <a class="dl" href="map_sketch_v1.png" download>Download full map</a>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
